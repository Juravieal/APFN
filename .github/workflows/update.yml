name: Redirect old address

# The site is built and published by the APFN server (DigitalOcean) at https://allprofantasy.us,
# which also writes the Tuesday recap and commits league records here. This workflow only keeps
# the old GitHub Pages address (juravieal.github.io/APFN) redirecting there.

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/update.yml]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
