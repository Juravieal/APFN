<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APFN League Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Exo+2:ital,wght@1,800;1,900&family=IBM+Plex+Sans:wght@400;500;600&family=Saira:wght@600;700&display=swap">
<style>
/* Layout: scoreboard header, three tabs, dense ranked tables; summary tiles sit above the detail. */
:root {
  --bg: #eceef1; --surface: #ffffff; --sunken: #e2e5e9; --line: #cdd2d8;
  --fg: #16181c; --fg2: #4a4f57; --fg3: #6f757e;
  --accent: #8a6a12; --accent-soft: #f1e6c4;
  --loot: #8a6a12; --loot-soft: #f1e6c4;
  --win: #1e6b43; --win-soft: #dcefe4; --loss: #a23a2a; --loss-soft: #f6dfda;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --brand: "Exo 2", "Arial Black", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111214; --surface: #1b1c20; --sunken: #15161a; --line: #2e3036;
  --fg: #eceef0; --fg2: #b4b8bf; --fg3: #8b9098;
  --accent: #d9b84e; --accent-soft: #3a3220;
  --loot: #e2c15a; --loot-soft: #3a3220;
  --win: #6fcb97; --win-soft: #173326; --loss: #f0907f; --loss-soft: #3d201c;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111214; --surface: #1b1c20; --sunken: #15161a; --line: #2e3036;
  --fg: #eceef0; --fg2: #b4b8bf; --fg3: #8b9098;
  --accent: #d9b84e; --accent-soft: #3a3220;
  --loot: #e2c15a; --loot-soft: #3a3220;
  --win: #6fcb97; --win-soft: #173326; --loss: #f0907f; --loss-soft: #3d201c;
  color-scheme: dark }

[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: 40px; }
h2 { font-size: 24px; }
h1, h2 { font-family: var(--brand); font-weight: 900; font-style: italic; letter-spacing: .01em; }
h3 { font-size: 17px; font-weight: 600; letter-spacing: .05em; color: var(--fg2); }
p { margin: 0; }
.muted { color: var(--fg2); }
.note { color: var(--fg2); max-width: 68ch; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 24px; border-bottom: 3px solid var(--fg); padding-bottom: 12px; }
header.top .meta { color: var(--fg2); font-size: 13px; text-align: right; }
.eyebrow { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-size: 14px; }

nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
nav.tabs button { font: 600 17px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg2); border-radius: 4px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: linear-gradient(180deg, #f3dc86, #d4ad3a 55%, #b48c22); color: #111; border-color: #8a6a12; }
nav.tabs button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.panel { display: flex; flex-direction: column; gap: 24px; }
.block { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); }
.tile .v { font: 700 26px var(--display); line-height: 1.1; overflow-wrap: anywhere; }
.tile .s { color: var(--fg2); font-size: 13px; }

.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
td.rank { font: 700 20px var(--display); color: var(--fg2); width: 1%; }
tr.cut td { border-bottom: 2px dashed var(--fg3); }
.team { display: flex; flex-direction: column; min-width: 170px; white-space: normal; }
.team b { font-weight: 600; overflow-wrap: break-word; }
.team span { color: var(--fg3); font-size: 12px; }
.chip { display: inline-block; font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--fg2); }
.chip.up { background: var(--win-soft); border-color: transparent; color: var(--fg); }
.chip.down { background: var(--loss-soft); border-color: transparent; color: var(--fg); }
.chip.loot { background: var(--loot-soft); border-color: transparent; color: var(--fg); }
.bar { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.bar i { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); }
.bar .track { flex: 1; background: var(--sunken); border-radius: 0 4px 4px 0; }
.wk { display: inline-flex; gap: 5px; align-items: baseline; padding: 2px 6px; border-radius: 3px; font-size: 13px; margin-right: 2px; }
.wk.W { background: var(--win-soft); } .wk.L { background: var(--loss-soft); } .wk.T { background: var(--sunken); }
.wk em { font: 700 12px var(--display); font-style: normal; }
.wk.W em { color: var(--win); } .wk.L em { color: var(--loss); }
.pos { color: var(--win); } .neg { color: var(--loss); }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.plain li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
ul.plain li:last-child { border-bottom: 0; }
ul.plain li > div { min-width: 0; overflow-wrap: anywhere; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.vs { color: var(--fg3); font-size: 12px; }

.owed { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--loot); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card .head { font-weight: 600; overflow-wrap: anywhere; }
.card ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
.card li span { color: var(--fg3); }
article.story { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
article.story:last-child { border-bottom: 0; }
article.story .kicker { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
article.story h2 { font-size: 30px; }
article.story .prose { display: flex; flex-direction: column; gap: 10px; max-width: 72ch; font-size: 15px; line-height: 1.6; }
article.story .prose b { font-weight: 700; color: var(--fg); }
article.story .prose b.un, b.un { color: var(--accent); }
/* Final scores, in the commissioner's table layout: league rank bold, conference rank italic */
.finals { max-width: 760px; }
.finals table { width: 100%; }
.finals th { font-size: 12px; }
.finals th.lr, .finals td.lr { width: 1%; text-align: center; font-weight: 700; }
.finals th.cr, .finals td.cr { width: 1%; text-align: center; font-style: italic; }
.finals td.lr { font-size: 16px; } .finals td.cr { color: var(--fg2); }
.finals td.who { white-space: normal; } .finals td.who span { display: block; color: var(--fg3); font-size: 12px; }
.finals td.pts { text-align: right; font-size: 15px; } .finals td.pts.won { font-weight: 700; } .finals td.pts.lost { color: var(--fg2); }
.finals td.top { color: var(--fg3); font-size: 12px; white-space: normal; }
.finals tbody + tbody tr:first-child td { border-top: 8px solid var(--bg); }
.finals tr.spot-row td, .finals .spot-bar { background: linear-gradient(180deg, #f1f3f5, #c3c8ce 55%, #959ca4); color: #111; padding: 4px 10px;
  font: 900 italic 13px/1.2 var(--brand); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.finals tr.gotw-row td, .finals .gotw-bar { background: linear-gradient(180deg, #f3dc86, #d4ad3a 55%, #b48c22); color: #111; padding: 4px 10px;
  font: 900 italic 13px/1.2 var(--brand); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.finals caption { caption-side: bottom; text-align: left; padding: 6px 2px 0; color: var(--fg3); font-size: 12px; }
@media (max-width: 560px) { .finals td.top { display: none; } .finals th.top { display: none; } }
article.story .game { display: flex; flex-direction: column; gap: 10px; }
article.story .prose.outro { padding-top: 16px; border-top: 1px dashed var(--line); }
/* Fixed column widths so the score columns line up from one game's table to the next */
article.story .game .finals table { table-layout: fixed; }
article.story .game .finals th.lr { width: 64px; } article.story .game .finals th.cr { width: 52px; }
article.story .game .finals th.r { width: 84px; } article.story .game .finals th.top { width: 34%; }
@media (max-width: 560px) { article.story .game .finals th.lr { width: 52px; } article.story .game .finals th.cr { width: 40px; } article.story .game .finals th.r { width: 72px; } }
article.story .game + .game { padding-top: 16px; border-top: 1px dashed var(--line); }
article.story .scores { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 12px; }
.game + .game { border-top: 1px solid var(--line); }
.game .n { overflow-wrap: anywhere; } .game .lose { color: var(--fg2); }
.game .star { grid-column: 1 / -1; color: var(--fg3); font-size: 12px; }
@media (max-width: 760px) { article.story { grid-template-columns: minmax(0, 1fr); } }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pick select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); max-width: 100%; }
.pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gone { color: var(--fg3); }
dialog.pin { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); padding: 20px; width: min(340px, calc(100vw - 32px)); }
dialog.pin::backdrop { background: rgba(10, 15, 20, .55); }
dialog.pin form { display: flex; flex-direction: column; gap: 12px; }
dialog.pin input { font: 700 28px var(--display); letter-spacing: .3em; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
dialog.pin .row { display: flex; gap: 8px; justify-content: flex-end; }
dialog.pin button { font: 600 16px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg2); cursor: pointer; }
dialog.pin button[type=submit] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
dialog.pin .err { color: var(--loss); min-height: 1.2em; margin: 0; }
nav.tabs button.locked::after { content: ""; display: inline-block; width: 9px; height: 10px; margin-left: 7px; vertical-align: 0; border: 2px solid currentColor; border-radius: 2px; border-top-width: 5px; opacity: .7; }
.issue { display: flex; gap: 8px; align-items: baseline; }
.chip.warn { background: var(--loot-soft); border-color: transparent; color: var(--fg); }
.chip.bad { background: var(--loss-soft); border-color: transparent; color: var(--fg); }
.chip.good { background: var(--win-soft); border-color: transparent; color: var(--fg); }
.bracket { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.bracket .round { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.match .lab { font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); padding: 6px 10px 0; }
.match .row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; padding: 4px 10px; align-items: baseline; }
.match .row:last-child { padding-bottom: 8px; }
.match .row .s { color: var(--fg3); font-variant-numeric: tabular-nums; }
.match .row .n { overflow-wrap: anywhere; }
.match .row.won .n, .match .row.won .p { font-weight: 700; }
.match .row.lost { color: var(--fg2); }
.match .p { font-variant-numeric: tabular-nums; }
details.season { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
details.season > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
details.season > div { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
tr.cut16 td { border-bottom: 2px dotted var(--fg3); }
.gotw { background: var(--loot-soft); }
/* ---- APFN Pro League banner: the league's steel-and-gold shields ---- */
.hero { --gold: #e2c15a; position: relative; overflow: hidden; isolation: isolate; color: #fff; padding: 22px 16px 20px;
  background: radial-gradient(70% 65% at 50% 32%, #3b3424 0%, #22201b 42%, #121214 74%, #0b0b0d 100%); }
.hero .beams { position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background:
    linear-gradient(98deg, transparent 12%, rgba(255, 226, 150, .06) 16%, transparent 22%),
    linear-gradient(82deg, transparent 78%, rgba(255, 226, 150, .06) 84%, transparent 88%); }
.hero .field { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: -1;
  background: linear-gradient(rgba(11, 11, 13, 0), rgba(52, 46, 32, .55) 70%, rgba(40, 36, 26, .8)); border-bottom: 3px solid #8a6a12; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero-top { max-width: 1260px; margin: 0 auto; display: grid; align-items: center; gap: 0 clamp(6px, 3vw, 48px);
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.hero .league { width: clamp(200px, 29vw, 400px); height: auto; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .65)); }
.hero .conf { width: min(100%, 250px); height: auto; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .6)); }
.hero .conf.left { justify-self: end; } .hero .conf.right { justify-self: start; }
.hero .ribbon-row { grid-column: 1 / -1; justify-self: center; margin-top: -8px; }
.ribbon-gold { display: inline-block; padding: 4px 30px 3px; border: 3px solid #111; border-radius: 4px;
  background: linear-gradient(180deg, #fbeaa6 0%, #e2c15a 45%, #b48c22 55%, #e8cf72 100%);
  font: 900 italic clamp(22px, 3vw, 36px)/1.05 var(--brand); text-transform: uppercase; color: #111;
  text-shadow: 0 0 6px rgba(255, 255, 255, .6); box-shadow: 0 6px 12px rgba(0, 0, 0, .5); }
/* Game of the week: smaller strip under the shields */
.gotw-strip { max-width: 900px; margin: 18px auto 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hero .label { white-space: nowrap; font: 700 clamp(11px, 1.1vw, 14px) Saira, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #d6d8dc; }
.hero .label i { font-style: normal; color: var(--gold); margin: 0 .7em; }
.gotw-strip .row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; }
.hero .vs { font: 900 italic clamp(30px, 3.6vw, 46px)/1 var(--brand); color: transparent; padding: 0 .1em;
  background: linear-gradient(180deg, #fff3b8 0%, #e2c15a 48%, #a8841f 52%, #e8cf72 100%); -webkit-background-clip: text; background-clip: text;
  -webkit-text-stroke: 2px #111; filter: drop-shadow(0 0 6px rgba(255, 255, 255, .35)) drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.hero .status { font: 600 11px Saira, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #9a9ea6; text-align: center; margin-top: 16px; }
.hero .status i { font-style: normal; color: #6d6f74; }
/* Nameplate: black outline, brushed-steel frame, black panel with gold ends */
.np { background: #0b0b0d; padding: 3px; width: 100%; max-width: 380px; justify-self: center;
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
.np .frame { padding: 5px; background: linear-gradient(180deg, #f4f4f5 0%, #c9ccd0 38%, #8d9197 50%, #c6c9ce 62%, #ececee 100%);
  clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
.np .panel { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 28px 8px 30px;
  background: linear-gradient(180deg, #2b2b2f 0%, #18181b 55%, #0e0e10 100%);
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
.np .panel::before, .np .panel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22px; background: linear-gradient(180deg, #f0d779, #c79f2e 55%, #8a6a12); }
.np .panel::before { left: 0; clip-path: polygon(0 0, 100% 0, 50% 100%, 0 100%); }
.np .panel::after { right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%); }
.np .av { position: relative; z-index: 1; flex: 0 0 auto; width: clamp(34px, 3.4vw, 46px); height: clamp(34px, 3.4vw, 46px); border-radius: 50%; object-fit: cover;
  background: #111; box-shadow: 0 0 0 2px #e2c15a, 0 0 0 4px #111; }
.np .who { min-width: 0; flex: 1; text-align: center; container-type: inline-size; }
.np b { display: block; white-space: nowrap; font: 900 italic min(26px, calc(140cqi / var(--len, 10)))/1.05 var(--brand);
  text-transform: uppercase; color: #fff; text-shadow: 0 0 8px rgba(255, 255, 255, .25); }
.np span { display: block; margin-top: 4px; font: 700 clamp(10px, 1vw, 12px) Saira, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
@media (max-width: 640px) {
  .hero-top { gap: 0 2px; }
  .hero .league { width: 165px; }
  .gotw-strip .row { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 4px; }
  .np { max-width: 340px; }
}

/* Section labels in the same style */
.banner-ribbon { align-self: flex-start; display: inline-block; padding: 4px 24px 3px; border: 3px solid #111; border-radius: 4px;
  background: linear-gradient(180deg, #fbeaa6 0%, #e2c15a 45%, #b48c22 55%, #e8cf72 100%);
  font: 900 italic 21px/1.1 var(--brand); text-transform: uppercase; color: #111; }
.silver-label { align-self: flex-start; display: inline-block; margin-top: 8px; padding: 4px 24px 3px; border: 3px solid #111; border-radius: 4px;
  background: linear-gradient(180deg, #f4f4f5 0%, #c9ccd0 40%, #8d9197 52%, #dcdee1 100%);
  font: 900 italic 21px/1.1 var(--brand); text-transform: uppercase; color: #111; }
/* Conference shields on recap stories */
article.story .kicker { flex-direction: row; align-items: center; gap: 14px; }
article.story .kicker .crest-sm { width: 64px; height: auto; flex: 0 0 auto; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .35)); }
article.story .kicker .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* Guillotine League: the chop line */
.chop tr.chopped td { background: var(--loss-soft); }
.chop tr.gone td { color: var(--fg3); } .chop tr.gone b.un { color: var(--fg3); }
.chop tr.cut td { border-top: 3px solid var(--loss); }
.chop td.who span { display: block; color: var(--fg3); font-size: 12px; }
.chop td.who { white-space: normal; }
table.chop caption { caption-side: bottom; text-align: left; padding: 6px 2px 0; color: var(--fg3); font-size: 12px; }
.finals .chop-bar { background: linear-gradient(180deg, #4a4f57, #2a2d33 55%, #16181c); color: #f0907f; padding: 4px 10px;
  font: 900 italic 13px/1.2 var(--brand); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.recap-bar { justify-content: flex-end; }
.recap-bar label { font: 600 14px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); }
button.pdf { font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 4px; cursor: pointer; }
button.pdf:hover { background: var(--accent-soft); }
button.pdf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.recap-week { display: flex; flex-direction: column; gap: 20px; }
.recap-week + .recap-week { padding-top: 12px; border-top: 3px solid var(--accent); }
h2.week-head { font-size: 22px; color: var(--accent); }
.print-head { display: none; }
/* Printing (and "Save as PDF" from the League Admin tab): just the recap, in light colors, one week per page run */
@media print {
  :root:root:root {
    --bg: #ffffff; --surface: #ffffff; --sunken: #f1f2f4; --line: #cdd2d8;
    --fg: #16181c; --fg2: #4a4f57; --fg3: #6f757e;
    --accent: #8a6a12; --accent-soft: #f1e6c4;
    color-scheme: light }
  @page { margin: 14mm 12mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11pt; }
  .hero, nav.tabs, footer, .recap-bar, dialog { display: none !important; }
  body.print-recap section.panel { display: none !important; }
  body.print-recap section#recap { display: flex !important; }
  .wrap { max-width: none; padding: 0; gap: 12px; }
  .print-head { display: block; margin: 0; padding-bottom: 6px; border-bottom: 2px solid var(--accent);
    font: 700 13pt var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .scroll { overflow: visible; }
  .recap-week + .recap-week { break-before: page; border-top: 0; padding-top: 0; }
  article.story .kicker, h2.week-head { break-after: avoid; }
  article.story .game, .finals { break-inside: avoid; }
  article.story .kicker .crest-sm { width: 44px; filter: none; }
}
footer { color: var(--fg3); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
a.jump { font: 600 17px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; text-decoration: none; margin-left: auto; }
a.jump:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<header class="hero" aria-label="APFN Pro League">
  <div class="beams" aria-hidden="true"></div><div class="field" aria-hidden="true"></div>
  <h1 class="sr-only">APFN Pro League Hub</h1>
  <div class="hero-top">
    <img class="conf left" src="img/art/armadillo-shield.webp" alt="Armadillo Conference shield">
    <img class="league" src="img/art/league-shield.webp" alt="APFN Pro League shield, Season 6">
    <img class="conf right" src="img/art/grizzly-shield.webp" alt="Grizzly Conference shield">
    <div class="ribbon-row" id="hero-ribbon"></div>
  </div>
  <div class="gotw-strip" id="hero-gotw"></div>
  <div class="status" id="hero-status"></div>
</header>
<div class="wrap">

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tab-recap" data-tab="recap">Recap</button>
    <button role="tab" id="tab-preview" data-tab="preview">Preview</button>
    <button role="tab" id="tab-power" data-tab="power">Power rankings</button>
    <button role="tab" id="tab-conferences" data-tab="conferences">Conferences</button>
    <button role="tab" id="tab-robber" data-tab="robber">Robber League</button>
    <button role="tab" id="tab-guillotine" data-tab="guillotine">Guillotine</button>
    <button role="tab" id="tab-records" data-tab="records">Record book</button>
    <button role="tab" id="tab-commish" data-tab="commish" class="locked">League Admin</button>
    <a class="jump" href="live.html">Live scoreboard</a>
  </nav>

  <section class="panel" id="recap" role="tabpanel" aria-labelledby="tab-recap"></section>
  <section class="panel" id="preview" role="tabpanel" aria-labelledby="tab-preview" hidden></section>
  <section class="panel" id="power" role="tabpanel" aria-labelledby="tab-power" hidden></section>
  <section class="panel" id="conferences" role="tabpanel" aria-labelledby="tab-conferences" hidden></section>
  <section class="panel" id="robber" role="tabpanel" aria-labelledby="tab-robber" hidden></section>
  <section class="panel" id="guillotine" role="tabpanel" aria-labelledby="tab-guillotine" hidden></section>
  <section class="panel" id="records" role="tabpanel" aria-labelledby="tab-records" hidden></section>
  <section class="panel" id="commish" role="tabpanel" aria-labelledby="tab-commish" hidden></section>
  <dialog class="pin" id="pin-dialog" aria-labelledby="pin-title">
    <form id="pin-form">
      <h2 id="pin-title">League Admin</h2>
      <label for="pin-input" class="note">Enter the PIN</label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <p class="err" id="pin-error" role="alert"></p>
      <div class="row"><button type="button" id="pin-cancel">Cancel</button><button type="submit">Open</button></div>
    </form>
  </dialog>

  <footer id="foot"></footer>
</div>

<script>
const D = /*__DATA__*/null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = {};
[...D.teams, ...D.robber.teams, ...(D.guillotine ? D.guillotine.teams : [])].forEach(t => T[t.key] = t);
const f1 = n => Number(n).toFixed(1), f2 = n => Number(n).toFixed(2);
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(Math.abs(n) >= 10 ? 1 : 2);
const last = D.done[D.done.length - 1] || 0;

const team = k => `<div class="team"><b>${esc(T[k].team)}</b><span>${esc(T[k].manager)}</span></div>`;
const short = k => esc(T[k].manager);
const rec = t => `${t.w}–${t.l}${t.t ? "–" + t.t : ""}`;
const weekCells = t => t.weeks.map(x => `<span class="wk ${x.res}" title="Week ${x.week}: ${f2(x.pts)} to ${f2(x.opp_pts)} vs ${short(x.opp)}"><em>${x.res}</em>${f1(x.pts)}</span>`).join("");
const luckChip = l => Math.abs(l) < 0.5 ? "" : ` <span class="chip ${l > 0 ? "up" : "down"}">${l > 0 ? "Lucky" : "Unlucky"}</span>`;
const bar = (v, max) => `<div class="bar"><span class="num">${f1(v)}</span><div class="track"><i style="width:${(100 * v / max).toFixed(1)}%"></i></div></div>`;

function rankTable(teams, showConf) {
  const max = Math.max(...teams.map(t => t.ppg));
  return `<div class="scroll"><table>
    <thead><tr><th>#</th><th>Team</th>${showConf ? "<th>Conf</th>" : ""}<th>Record</th><th>All-play</th><th>Points per game</th><th class="r">Luck</th><th class="r">Lineup</th><th>Weekly scores</th></tr></thead>
    <tbody>${teams.map(t => `<tr>
      <td class="rank">${t.rank}</td><td>${team(t.key)}</td>
      ${showConf ? `<td><span class="chip">${esc(t.conf)}</span></td>` : ""}
      <td>${rec(t)}</td><td>${t.ap_w}–${t.ap_l}${t.ap_t ? "–" + t.ap_t : ""}</td>
      <td>${bar(t.ppg, max)}</td>
      <td class="r"><span class="${t.luck > 0 ? "pos" : t.luck < 0 ? "neg" : ""}">${signed(t.luck)}</span>${luckChip(t.luck)}</td>
      <td class="r" title="${f1(t.left)} points left on the bench">${t.eff == null ? "" : f1(t.eff) + "%"}</td>
      <td>${weekCells(t)}</td></tr>`).join("")}</tbody></table></div>`;
}

// Bold every manager's Sleeper name in recap text, so people skimming can find their mentions.
const NAME_RE = (() => {
  const names = [...new Set(Object.values(T).map(t => t.manager))].sort((a, b) => b.length - a.length)
    .map(n => esc(n).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return new RegExp(`(?<![\\w])(${names.join("|")})(?![\\w])`, "g");
})();
const boldNames = html => html.replace(NAME_RE, `<b class="un">$1</b>`);

// One game's final-score rows, each with its own column header and rank note.
function gameScores(L, g) {
  const robber = L.robber;
  const win = g[0].pts >= g[1].pts ? 0 : 1;
  const row = (s, won) => `<tr><td class="lr">${s.lr ?? ""}</td>${robber ? "" : `<td class="cr">${s.cr ?? ""}</td>`}
    <td class="who"><b class="un">${esc(T[s.team].manager)}</b><span>${esc(T[s.team].team)}</span></td>
    <td class="pts num ${won ? "won" : "lost"}">${f2(s.pts)}</td><td class="top">${esc(s.star)} ${f1(s.star_pts)}</td></tr>`;
  return `<div class="finals">${g[0].gotw ? `<div class="gotw-bar">★ Game of the week ★</div>` : g[0].spot ? `<div class="spot-bar">Conference spotlight</div>` : ""}<div class="scroll"><table>
    <thead><tr><th class="lr">${robber ? "Rank" : "League"}</th>${robber ? "" : `<th class="cr">Conf</th>`}<th>Manager</th><th class="r">Score</th><th class="top">Top scorer</th></tr></thead>
    <tbody>${row(g[0], win === 0)}${row(g[1], win === 1)}</tbody>
    <caption>${g[0].lr == null ? "No standings yet in week 1." : g[0].pre ? "Preseason <b>league rank</b> and <i>conference rank</i>, from last season's points." : robber ? "Robber League rank going into the week." : "<b>League rank</b> and <i>conference rank</i> going into the week."}</caption>
  </table></div></div>`;
}

// Pair each paragraph with the game of the first manager it names; a paragraph naming no one stays with the one before it.
// One that reaches back to a game already covered (a league-wide note) closes the section instead.
// Games keep the server's importance order (game of the week or spotlight first); a game the story skips shows just its scores.
function recapGames(L) {
  const gameOf = {};
  L.games.forEach((g, i) => g.forEach(s => gameOf[T[s.team].manager] = i));
  const prose = {};
  let cur = null;
  for (const p of L.paragraphs) {
    const hit = [...esc(p).matchAll(NAME_RE)].map(m => gameOf[m[1]]).find(i => i !== undefined);
    const key = hit !== undefined && hit !== cur && hit in prose ? "outro"
      : hit !== undefined ? (cur = hit) : (cur ?? "intro");
    (prose[key] ||= []).push(p);
  }
  const paras = list => (list || []).map(p => `<p>${boldNames(esc(p))}</p>`).join("");
  return (prose.intro ? `<div class="prose">${paras(prose.intro)}</div>` : "")
    + L.games.map((g, i) => `<section class="game">${gameScores(L, g)}${prose[i] ? `<div class="prose">${paras(prose[i])}</div>` : ""}</section>`).join("")
    + (prose.outro ? `<div class="prose outro">${paras(prose.outro)}</div>` : "");
}

function matchupTable(games, kind) {
  // kind: "league" (league record), "conference" (conference record), "robber" (one rank)
  const robber = kind === "robber", cols = robber ? 3 : 4;
  const row = s => `<tr><td class="lr">${s.lr ?? ""}</td>${robber ? "" : `<td class="cr">${s.cr ?? ""}</td>`}
    <td class="who"><b class="un">${esc(T[s.key].manager)}</b><span>${esc(T[s.key].team)}${kind === "league" ? ` · ${esc(T[s.key].conf)}` : ""}</span></td>
    <td class="pts num">${esc(kind === "conference" ? s.crec : s.lrec)}</td></tr>`;
  return `<div class="finals"><div class="scroll"><table>
    <thead><tr><th class="lr">${robber ? "Rank" : "League"}</th>${robber ? "" : `<th class="cr">Conf</th>`}<th>Manager</th><th class="r">${kind === "conference" ? "Conf record" : "Record"}</th></tr></thead>
    ${games.map(g => `<tbody>${g[0].gotw ? `<tr class="gotw-row"><td colspan="${cols}">★ Game of the week ★</td></tr>` : g[0].spot ? `<tr class="spot-row"><td colspan="${cols}">Conference spotlight</td></tr>` : ""}${row(g[0])}${row(g[1])}</tbody>`).join("")}
  </table></div></div>`;
}

function renderPreview() {
  const P = D.preview, el = document.getElementById("preview");
  const shield = n => ({ Armadillo: "armadillo", Grizzly: "grizzly" }[n]);
  const head = (img, eyebrow, title, note) => `<div class="kicker">${img ? `<img class="crest-sm" src="img/art/${img}-shield.webp" alt="">` : ""}<div class="txt"><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${note ? `<p class="note">${note}</p>` : ""}</div></div>`;
  const league = P.league.length ? `<article class="story">${head("league", "Pro League · week " + P.league_week,
      P.league_week === P.week ? "League play" : `League play starts week ${P.league_week}`,
      P.league_week === P.week
        ? "Cross-conference games that count in the combined league table. These aren't on Sleeper: your score this week counts in both your conference game and this one."
        : `Each team plays one extra game a week against the other conference from week ${P.league_week} to 14. These are week ${P.league_week}'s games, ranked by today's standings.`)}
      ${matchupTable(P.league, "league")}</article>` : "";
  // The conference holding the game of the week goes first; the other opens with its Spotlight.
  const hasGotw = games => games.some(g => g[0].gotw);
  const confs = Object.entries(P.conferences).sort(([, x], [, y]) => hasGotw(y) - hasGotw(x)).map(([name, games]) => `<article class="story">${head(shield(name), `${esc(name)} Conference · week ${P.week}`, `${esc(name)} Conference`, "")}${matchupTable(games, "conference")}</article>`).join("");
  const robber = P.robber.length ? `<article class="story">${head("", `Robber League · week ${P.week}`, "Robber League", "Winners steal a player from the team they beat.")}${matchupTable(P.robber, "robber")}</article>` : "";
  const g = G && !G.final && G.block.length ? `<article class="story">${head("", `Guillotine League · week ${P.week}`, "On the block", `${G.alive} teams left. The lowest season total after this week is chopped.`)}
    <div class="finals"><div class="scroll"><table class="chop"><thead><tr><th class="lr">#</th><th>Manager</th><th class="r">Season</th><th class="r">Above the line</th></tr></thead>
    <tbody>${G.block.slice(0, 5).map((b, i) => `<tr class="${i === 0 ? "chopped" : ""}"><td class="lr">${G.alive - i}</td>${gWho(b.team)}<td class="r num"><b>${f2(b.total)}</b></td><td class="r num">${i === 0 ? chip("down", "On the block") : "+" + f2(b.cushion)}</td></tr>`).join("")}</tbody>
    <caption>The bottom five by season points. Full table in the Guillotine tab.</caption></table></div></div></article>` : "";
  // League play leads in the weeks it is played; before it starts, the look ahead goes last.
  const body = P.league_week === P.week ? league + confs + robber + g : confs + robber + g + league;
  el.innerHTML = `<p class="note">Week ${P.week} matchups, ranked by importance. <b>League rank</b> and <i>conference rank</i> are as things stand going into the week.</p>${body}`;
}

// Every finished week stays readable: anyone can pick a week, or the whole season.
// Saving one as a PDF is in the League Admin tab (printRecap).
let recapPick = null;
function renderRecap() {
  const all = D.recaps || [], el = document.getElementById("recap");
  if (!all.length) { el.innerHTML = `<p class="note">The first recap appears once week 1 is final.</p>`; return; }
  if (recapPick !== "all" && !all.some(R => R.week === recapPick)) recapPick = all[0].week;
  const shown = recapPick === "all" ? [...all].reverse() : all.filter(R => R.week === recapPick);
  const title = recapPick === "all" ? `${D.season} season recaps` : `Week ${recapPick} recap`;
  const crest = { Armadillo: "armadillo", Grizzly: "grizzly", League: "league" };
  const label = n => n === "League" ? "League play" : n === "Robber" ? "Robber League" : n === "Guillotine" ? "Guillotine League" : `${n} Conference`;
  const story = (R, L) => `<article class="story">
    <div class="kicker">${crest[L.name] ? `<img class="crest-sm" src="img/art/${crest[L.name]}-shield.webp" alt="">` : ""}<div class="txt"><span class="eyebrow">${esc(label(L.name))} · week ${R.week}</span><h2>${esc(L.headline)}</h2></div></div>
    ${L.guillotine ? chopTable(L.guillotine) + (L.paragraphs.length ? `<div class="prose">${L.paragraphs.map(p => `<p>${boldNames(esc(p))}</p>`).join("")}</div>` : "") : recapGames(L)}
    ${L.byline ? `<p class="vs">${esc(L.byline)}</p>` : ""}
  </article>`;
  el.innerHTML = `<div class="recap-bar pick">
      <label for="recap-week">Week</label>
      <select id="recap-week">${all.map((R, i) => `<option value="${R.week}"${R.week === recapPick ? " selected" : ""}>Week ${R.week}${i === 0 ? " (latest)" : ""}</option>`).join("")}<option value="all"${recapPick === "all" ? " selected" : ""}>Whole season</option></select>
    </div>
    <p class="print-head">APFN Pro League · ${esc(title)}</p>
    ${shown.map(R => `<div class="recap-week">${recapPick === "all" ? `<h2 class="week-head">Week ${R.week}</h2>` : ""}${R.leagues.map(L => story(R, L)).join("")}</div>`).join("")}`;
  document.getElementById("recap-week").addEventListener("change", e => {
    recapPick = e.target.value === "all" ? "all" : +e.target.value;
    renderRecap();
  });
}

// Print one week's recap (or the whole season) from any tab. The browser's print dialog offers
// "Save as PDF", and the page title becomes the file name.
function printRecap(pick) {
  recapPick = pick;
  renderRecap();
  const was = document.title;
  document.title = `APFN Pro League ${pick === "all" ? `${D.season} season recaps` : `${D.season} week ${pick} recap`}`;
  document.body.classList.add("print-recap");
  addEventListener("afterprint", () => { document.title = was; document.body.classList.remove("print-recap"); }, { once: true });
  print();
}

function renderPower() {
  const ts = D.teams, [a, b] = D.conferences;
  const lucky = [...ts].sort((x, y) => y.luck - x.luck)[0], unlucky = [...ts].sort((x, y) => x.luck - y.luck)[0];
  const lead = D.cross[a] >= D.cross[b] ? a : b, trail = lead === a ? b : a;
  document.getElementById("power").innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="k">Number one</span><span class="v">${esc(ts[0].team)}</span><span class="s">${esc(ts[0].manager)} · ${esc(ts[0].conf)} · all-play ${ts[0].ap_w}–${ts[0].ap_l}</span></div>
      <div class="tile"><span class="k">Conference vs conference</span><span class="v">${esc(lead)} ${D.cross[lead]}–${D.cross[trail]}</span><span class="s">Every ${esc(a)} score against every ${esc(b)} score, each week. Average ${f1(D.conf_ppg[a])} vs ${f1(D.conf_ppg[b])} a game.</span></div>
      <div class="tile"><span class="k">Luckiest</span><span class="v">${esc(lucky.team)}</span><span class="s">${esc(lucky.manager)} · ${rec(lucky)} with ${f2(lucky.xw)} expected wins</span></div>
      <div class="tile"><span class="k">Unluckiest</span><span class="v">${esc(unlucky.team)}</span><span class="s">${esc(unlucky.manager)} · ${rec(unlucky)} with ${f2(unlucky.xw)} expected wins</span></div>
    </div>
    <div class="block">
      <h2>All 20 teams, one table</h2>
      <p class="note">Ranked by all-play record: each week, every team is scored against the other 19 across both conferences, so the schedule stops mattering. Luck is actual wins minus the wins that all-play record would predict. Lineup is points scored as a share of the best lineup that roster could have started.</p>
      ${rankTable(ts, true)}
    </div>`;
}

function standings(teams, cut) {
  const rows = [...teams].sort((x, y) => y.w - x.w || y.pf - x.pf);
  return `<div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th>Record</th><th class="r">PF</th><th class="r">PA</th><th class="r">Power</th></tr></thead>
    <tbody>${rows.map((t, i) => `<tr class="${i === cut - 1 ? "cut" : ""}"><td class="rank">${i + 1}</td><td>${team(t.key)}</td><td>${rec(t)}</td><td class="r">${f1(t.pf)}</td><td class="r">${f1(t.pa)}</td><td class="r">#${t.rank}</td></tr>`).join("")}</tbody></table></div>`;
}
const games = list => `<div class="list"><ul class="plain">${list.map(([x, y]) => `<li><div><b>${esc(T[x].team)}</b> <span class="vs">#${T[x].rank} · ${rec(T[x])}</span></div><div style="text-align:right"><b>${esc(T[y].team)}</b> <span class="vs">#${T[y].rank} · ${rec(T[y])}</span></div></li>`).join("")}</ul></div>`;

// ---- league table, league games and brackets ---------------------------------------------------
function bracketView(rounds, who) {
  if (!rounds.length) return "";
  return `<div class="bracket">${rounds.map(r => `<div class="round"><h3>Week ${r.week}</h3>${r.games.map(g => {
    const row = (seed, key, pts) => `<div class="row ${g.winner ? (g.winner === key ? "won" : "lost") : ""}"><span class="s">${seed}</span><span class="n">${who(key)}</span><span class="p">${pts == null ? "" : f2(pts)}</span></div>`;
    return `<div class="match"><div class="lab">${esc(g.label)}</div>${row(g.hi_seed, g.hi, g.hi_pts)}${row(g.lo_seed, g.lo, g.lo_pts)}</div>`;
  }).join("")}</div>`).join("")}</div>`;
}
function leagueBlock() {
  const L = D.league, rec = r => `${r.w}–${r.l}${r.t ? "–" + r.t : ""}`;
  const who = k => `${esc(T[k].team)} <span class="vs">${esc(T[k].manager)}</span>`;
  const table = `<div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th>Conf</th><th>League record</th><th class="r">PF</th><th>Conference record</th></tr></thead>
    <tbody>${L.table.map(t => `<tr class="${t.rank === 8 ? "cut" : t.rank === 16 ? "cut16" : ""}"><td class="rank">${t.rank}</td><td>${team(t.key)}</td><td><span class="chip">${esc(T[t.key].conf)}</span></td><td>${rec(t)}</td><td class="r">${f1(t.pf)}</td><td>${rec(t.conf_record)}</td></tr>`).join("")}</tbody></table></div>`;
  const G = L.week_games;
  const games = G.games.length ? `<div class="block"><h3>Week ${G.week} games, by importance</h3><p class="note">Ranked by the two teams' combined league rank, lowest first${L.has_schedule ? "; cross-conference league games come first in weeks 5–14" : ""}.</p><div class="list"><ul class="plain">${G.games.map((g, i) => `<li class="${i === 0 ? "gotw" : ""}"><div>${i === 0 ? '<span class="chip loot">Game of the week</span> ' : ""}<span class="chip">${esc(g.kind)}</span><br><b>#${g.a_rank} ${esc(T[g.a].team)}</b> v <b>#${g.b_rank} ${esc(T[g.b].team)}</b><br><span class="vs">${esc(T[g.a].manager)} v ${esc(T[g.b].manager)}</span></div><div class="vs num">${g.a_rank + g.b_rank}</div></li>`).join("")}</ul></div></div>` : "";
  const brackets = L.title.length ? `<div class="block"><div class="banner-ribbon">Playoffs</div>${bracketView(L.title, who)}</div><div class="block"><div class="silver-label">Consolation</div>${bracketView(L.consolation, who)}</div>` : "";
  const champ = L.champion ? `<div class="tile"><span class="k">${D.season} league champion</span><span class="v">${esc(T[L.champion].team)}</span><span class="s">${esc(T[L.champion].manager)}</span></div>` : "";
  return `<div class="block"><h2>League table</h2>${champ}
    <p class="note">All 20 teams together, by wins then points for${L.has_schedule ? ", counting the cross-conference league games from week 5" : ""}. After week 14 the top 8 (above the dashed line) play for the league title and 9–16 (above the dotted line) play the consolation bracket, in weeks 15–17.${L.provisional ? " Seeds are as things stand." : ""}</p>
    ${table}</div>${games}${brackets}`;
}
function pastTournaments() {

}

const player = p => `<b>${esc(p.name)}</b> <span class="vs">${esc(p.pos)} · ${esc(p.nfl)}</span>`;
function renderRobber() {
  const R = D.robber, S = R.summary;
  const owed = R.owed.length ? `<div class="block">
      <h2>Steals still to be made</h2>
      <p class="note">Winners who have not yet taken a player. The list under each is the loser's roster ranked by points per game this season.</p>
      <div class="owed">${R.owed.map(o => `<div class="card">
        <div class="head">Week ${o.week}: ${short(o.winner)} robs ${short(o.loser)} <span class="vs num">${f1(o.score[0])}–${f1(o.score[1])}</span></div>
        <ol>${o.targets.map(p => `<li>${esc(p.name)} <span>${esc(p.pos)} · ${esc(p.nfl)} · ${f1(p.ppg)} a game</span></li>`).join("")}</ol>
      </div>`).join("")}</div></div>` : "";
  const ledger = [...R.steals].sort((x, y) => y.week - x.week || y.net - x.net);
  const mgr = [...R.teams].sort((x, y) => y.w - x.w || y.pf - x.pf);
  const flagged = R.bench.filter(b => b.flag);
  document.getElementById("robber").innerHTML = `
    <p class="note"><b>House rules.</b> No bench. Each week's winner steals one player of their choice from the team they beat, and the loser jumps the winner in waiver order. Bench slots are only for injured players and players on a bye.</p>
    ${owed}
    <div class="block">
      <h2>Robbery ledger</h2>
      <p class="note">Haul is what the stolen player has scored for the thief since. Net subtracts what the player released to make room scored over the same weeks.</p>
      <div class="scroll"><table><thead><tr><th>Wk</th><th>Thief</th><th>Robbed</th><th>Player taken</th><th>Released to make room</th><th class="r">Haul</th><th class="r">Net</th><th>Now with</th></tr></thead>
      <tbody>${ledger.map(s => `<tr><td class="rank">${s.week}</td><td>${short(s.thief)} <span class="vs num">${f1(s.score[0])}–${f1(s.score[1])}</span></td><td>${short(s.victim)}</td>
        <td>${player(s.player)}</td><td>${s.released ? player(s.released) : '<span class="vs">had an open slot</span>'}</td>
        <td class="r" title="${s.held_weeks} week(s) held, ${s.started} started">${s.held_weeks ? f1(s.loot) : '<span class="vs">no games yet</span>'}</td>
        <td class="r">${s.held_weeks ? `<span class="${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${signed(s.net)}</span>` : ""}</td>
        <td>${s.holder ? (s.holder === s.thief ? short(s.holder) : `${short(s.holder)} <span class="chip loot">Moved on</span>`) : '<span class="vs">Free agent</span>'}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <div class="block">
      <h2>Standings and robbery balance</h2>
      <p class="note">Gained is the net from steals made. Lost is what stolen players have scored since they were taken. The dashed line marks the ${R.playoff_teams} playoff places.</p>
      <div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th>Record</th><th class="r">PF</th><th>All-play</th><th class="r">Steals</th><th class="r">Robbed</th><th class="r">Gained</th><th class="r">Lost</th><th class="r">Balance</th><th class="r">Waiver</th></tr></thead>
      <tbody>${mgr.map((t, i) => { const s = S[t.key]; return `<tr class="${i === R.playoff_teams - 1 ? "cut" : ""}"><td class="rank">${i + 1}</td><td>${team(t.key)}</td><td>${rec(t)}</td><td class="r">${f1(t.pf)}</td><td>${t.ap_w}–${t.ap_l}</td>
        <td class="r">${s.steals}</td><td class="r">${s.robbed}</td><td class="r">${signed(s.gained)}</td><td class="r">${f1(s.lost)}</td>
        <td class="r"><span class="${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${signed(s.net)}</span></td><td class="r">${t.waiver ?? ""}</td></tr>`; }).join("")}</tbody></table></div>
    </div>
    <div class="cols">
      <div class="block"><h2>Week ${D.week_now} games</h2>${games(R.upcoming)}</div>
      <div class="block"><h2>Bench check</h2>
        <p class="note">${flagged.length ? "Players on a bench who are not on a bye and have no injury tag." : "Every benched player is injured or on a bye."}</p>
        ${flagged.length ? `<div class="list"><ul class="plain">${flagged.map(b => `<li><div>${player(b)}</div><div class="vs">${short(b.team)}</div></li>`).join("")}</ul></div>` : ""}
      </div>
    </div>`;
}

// ---- Guillotine League: lowest season points total is chopped each week; no head-to-head ----
const G = D.guillotine;
const gWho = k => `<td class="who"><b class="un">${esc(T[k].manager)}</b><span>${esc(T[k].team)}</span></td>`;
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;

// One finished week, in the league's own format: every team by season points with FAAB at the chop,
// then the chopped roster going back to free agency.
function chopTable(w) {
  const row = (r, i) => `<tr class="${r.chopped ? "chopped cut" : r.out ? "gone" : ""}"><td class="lr">${i + 1}</td>${gWho(r.team)}
    <td class="pts num ${r.out ? "lost" : "won"}">${f2(r.total)}</td>
    <td class="r num">$${r.faab.toLocaleString()}${r.penalty ? " " + chip("down", `−$${G.penalty} penalty`) : ""}</td>
    <td class="r">${r.chopped ? chip("down", "Chopped") : r.out ? `<span class="vs">Out wk ${r.out}</span>` : ""}</td></tr>`;
  return `<div class="finals"><div class="chop-bar">✂ ${esc(T[w.chopped].manager)} chopped · ${w.teams - 1} left</div><div class="scroll"><table class="chop">
    <thead><tr><th class="lr">Pos</th><th>Player</th><th class="r">Points</th><th class="r">FAAB remaining</th><th></th></tr></thead>
    <tbody>${w.table.map(row).join("")}</tbody>
    <caption>Season points after week ${w.week}. FAAB as it stood at the chop, before that week's waivers. ${esc(T[w.chopped].manager)} missed by ${f2(w.cushion)}; ${esc(T[w.penalty].manager)} had the week's lowest score among teams that carry on and pays $${G.penalty}.</caption>
  </table></div></div>
  ${w.returned.length ? `<div class="block"><h3>Players returned to free agency this week</h3><div class="list"><ul class="plain">${w.returned.map(p => `<li><div><b>${esc(p.name)}</b> <span class="vs">${esc(p.pos)} · ${esc(p.nfl)}</span></div></li>`).join("")}</ul></div></div>` : ""}`;
}

function renderGuillotine() {
  const el = document.getElementById("guillotine");
  if (!G) { el.innerHTML = ""; return; }
  const lastW = G.weeks[G.weeks.length - 1], low = G.block[0], next = G.block[1];
  const champs = G.champions.filter(c => c.champion);
  const repeat = champs.length > 1 && champs.every(c => c.champion === champs[0].champion) ? champs[0].champion : null;
  const block = `<div class="scroll"><table class="chop">
    <thead><tr><th class="lr">#</th><th>Manager</th><th class="r">Season</th><th class="r">Last week</th><th class="r">Above the line</th><th class="r">FAAB</th></tr></thead>
    <tbody>${[...G.block].reverse().map((b, i, a) => `<tr class="${i === a.length - 1 ? "chopped cut" : ""}"><td class="lr">${i + 1}</td>${gWho(b.team)}
      <td class="r num"><b>${f2(b.total)}</b></td><td class="r num">${f2(b.last)}</td>
      <td class="r num">${i === a.length - 1 ? chip("down", "On the block") : "+" + f2(b.cushion)}</td>
      <td class="r num">$${b.faab}</td></tr>`).join("")}</tbody>
    <caption>Going into week ${D.week_now}. "Above the line" is the cushion over the bottom team. FAAB is what Sleeper shows now.</caption></table></div>`;
  const graveyard = `<div class="scroll"><table><thead><tr><th>Week</th><th>Chopped</th><th class="r">Season points</th><th class="r">Missed by</th><th>$${G.penalty} penalty</th></tr></thead>
    <tbody>${[...G.weeks].reverse().map(w => { const r = w.rows.find(x => x.chopped); return `<tr><td class="rank">${w.week}</td>${gWho(w.chopped)}<td class="r num">${f2(r.total)}</td><td class="r num">${f2(w.cushion)}</td><td>${esc(T[w.penalty].manager)}</td></tr>`; }).join("")}</tbody></table></div>`;
  const bids = G.bids.length ? `<div class="list"><ul class="plain">${G.bids.map(b => `<li><div><b>${esc(b.player)}</b> <span class="vs">to ${esc(T[b.team].manager)} · week ${b.week}</span></div><div class="num"><b>$${b.bid}</b></div></li>`).join("")}</ul></div>` : `<p class="note">No waiver bids yet.</p>`;
  const standing = G.final ? `<span class="v">Season over</span><span class="s">${esc(T[G.final.champion].manager)} won the final</span>`
    : `<span class="v">${G.alive} of ${G.start}</span><span class="s">${G.alive > 2 ? `${G.alive - 2} more chops, then the final` : "The final is next"}</span>`;
  el.innerHTML = `
    <p class="note"><b>House rules.</b> Head-to-head results do not count; season points are everything. After each week the team with the lowest season points total is chopped and its roster goes to free agency ahead of waivers. The week's lowest score among teams that carry on costs $${G.penalty} of a $${G.budget} FAAB budget. One team goes each week until two are left, and they meet head to head in week 17 for the title.</p>
    <div class="tiles">
      <div class="tile"><span class="k">Still standing</span>${standing}</div>
      ${low && !G.final ? `<div class="tile"><span class="k">On the block</span><span class="v">${esc(T[low.team].manager)}</span><span class="s">${f2(low.total)} points${next ? `, ${f2(next.cushion)} behind ${esc(T[next.team].manager)}` : ""}</span></div>` : ""}
      ${lastW ? `<div class="tile"><span class="k">Last chopped</span><span class="v">${esc(T[lastW.chopped].manager)}</span><span class="s">Week ${lastW.week}, missed by ${f2(lastW.cushion)}</span></div>` : ""}
      ${repeat ? `<div class="tile"><span class="k">Two-time champion</span><span class="v">${esc(repeat)}</span><span class="s">Has won all ${champs.length} seasons so far</span></div>` : ""}
    </div>
    ${G.final ? "" : `<div class="block"><h2>The chopping block</h2><p class="note">Every team still alive, by season points. The bottom team goes next unless it outscores someone above it this week.</p>${block}</div>`}
    ${lastW ? `<div class="block"><h2>Week ${lastW.week}</h2>${chopTable(lastW)}</div>` : ""}
    <div class="block"><h2>The graveyard</h2>${graveyard}</div>
    <div class="block"><h2>Waiver frenzy</h2><p class="note">The biggest FAAB bids this season. Chopped rosters go to free agency, so this is where the dead teams' players end up.</p>${bids}</div>
    <div class="block"><h2>Champions</h2><div class="list"><ul class="plain">${G.champions.map(c => `<li><div><b>${esc(c.champion || "—")}</b> <span class="vs">${esc(c.name)} · ${c.teams} teams</span></div><div class="num">${c.season}</div></li>`).join("")}</ul></div></div>`;
}

function renderRecords() {
  const R = D.records, N = id => esc(R.names[id] || "Vacant team");
  const when = g => `<span class="vs">${g.season} wk ${g.week} · ${esc(g.conf)}${g.playoff ? " · playoffs" : ""}</span>`;

  const sideList = (title, list) => `<div class="block"><h3>${title}</h3><div class="list"><ul class="plain">${list.map(s => `<li><div><b>${N(s.id)}</b> <span class="vs">vs ${N(s.opp)}</span><br>${when(s)}</div><div class="num"><b>${f2(s.pts)}</b></div></li>`).join("")}</ul></div></div>`;
  const streak = (title, list) => `<div class="block"><h3>${title}</h3><div class="list"><ul class="plain">${list.map(s => `<li><div><b>${N(s.id)}</b><br><span class="vs">${s.from[0]} wk ${s.from[1]} to ${s.to[0]} wk ${s.to[1]}</span></div><div class="num"><b>${s.n}</b></div></li>`).join("")}</ul></div></div>`;
  const years = [...new Set(R.champions.map(c => c.season))];
  const confs = [...new Set(R.champions.map(c => c.conf))].sort();
  document.getElementById("records").innerHTML = `
    <p class="note">${R.games} games since ${R.seasons[0]}: the Eagle and Kangaroo conferences through ${years[0]}, then Armadillo and Grizzly. Regular-season and playoff-bracket games count; consolation games do not. The Robber League is not included.</p>
    <div class="block"><h2>Champions</h2>
      <div class="scroll"><table><thead><tr><th>Season</th><th>League champion</th>${confs.map(c => `<th>${esc(c)} champion</th><th>Runner-up</th>`).join("")}</tr></thead>
      <tbody>${years.map(y => `<tr><td class="rank">${y}</td><td>${R.league_champions[y] ? `<span class="chip loot">Champion</span> <b>${esc(R.league_champions[y])}</b>` : ""}</td>${confs.map(c => { const x = R.champions.find(k => k.season === y && k.conf === c); return x ? `<td><b>${N(x.champion)}</b></td><td>${N(x.runner_up)}</td>` : "<td></td><td></td>"; }).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="note">League champions are from the league's Hall of Champions. Conference champions and runners-up are the finals of each conference's Sleeper bracket.</p></div>
    ${G && G.champions.length ? `<div class="block"><h2>Guillotine League champions</h2><div class="list"><ul class="plain">${G.champions.map(c => `<li><div><span class="chip loot">Champion</span> <b>${esc(c.champion || "—")}</b> <span class="vs">${esc(c.name)} · ${c.teams} teams</span></div><div class="num">${c.season}</div></li>`).join("")}</ul></div></div>` : ""}
    <div class="block"><h2>All-time managers</h2>
      <p class="note">Regular-season records. Greyed names are not in the league this season. Managers who changed Sleeper accounts are combined under their current name.</p>
      <div class="scroll"><table><thead><tr><th>Manager</th><th class="r">Seasons</th><th>Record</th><th class="r">Win %</th><th class="r">Pts / game</th><th class="r">Playoffs</th><th class="r">Finals</th><th>League titles</th><th>Conference titles</th></tr></thead>
      <tbody>${R.managers.map(m => `<tr><td class="${m.active ? "" : "gone"}"><b>${esc(m.name)}</b>${m.formerly.length ? `<br><span class="vs">formerly ${esc(m.formerly.join(", "))}</span>` : ""}</td><td class="r">${m.seasons}</td><td>${m.w}–${m.l}${m.t ? "–" + m.t : ""}</td><td class="r">${(100 * m.pct).toFixed(1)}</td><td class="r">${f1(m.ppg)}</td><td class="r">${m.playoffs}</td><td class="r">${m.finals}</td><td>${m.league_titles.length ? `<span class="chip loot">${m.league_titles.length}</span> <span class="vs">${m.league_titles.join(", ")}</span>` : ""}</td><td>${m.titles ? `<span class="chip loot">${m.titles}</span> <span class="vs">${esc(m.title_years.join(", "))}</span>` : ""}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="block"><h2>Head to head</h2>
      <div class="pick"><label for="h2h-pick">Manager</label><select id="h2h-pick">${R.current.map(id => `<option value="${esc(id)}">${N(id)}</option>`).join("")}</select></div>
      <div id="h2h-out"></div></div>
    ${pastTournaments()}
    <div class="block"><h2>Single-game records</h2>
      <div class="cols">
        ${sideList("Highest scores", R.high)}
        ${sideList("Lowest scores", R.low)}
        ${gameList("Biggest blowouts", R.blowouts, g => "by " + f2(g.wp - g.lp))}
        ${gameList("Closest games", R.closest, g => "by " + f2(g.wp - g.lp))}
        ${gameList("Highest combined", R.shootouts, g => f2(g.wp + g.lp))}
      </div></div>
    <div class="block"><h2>Streaks and seasons</h2>
      <div class="cols">
        ${streak("Longest winning streaks", R.win_streaks)}
        ${streak("Longest losing streaks", R.loss_streaks)}
        <div class="block"><h3>Most points in a season</h3><div class="list"><ul class="plain">${R.best_seasons.map(s => `<li><div><b>${N(s.id)}</b><br><span class="vs">${s.season} ${esc(s.conf)} · ${s.w}–${s.l}</span></div><div class="num"><b>${f1(s.pf)}</b></div></li>`).join("")}</ul></div></div>
        <div class="block"><h3>Best regular seasons</h3><div class="list"><ul class="plain">${R.best_records.map(s => `<li><div><b>${N(s.id)}</b><br><span class="vs">${s.season} ${esc(s.conf)} · ${f1(s.pf)} points</span></div><div class="num"><b>${s.w}–${s.l}</b></div></li>`).join("")}</ul></div></div>
      </div></div>`;
  const pick = document.getElementById("h2h-pick"), out = document.getElementById("h2h-out");
  const draw = () => {
    const rows = Object.entries(R.h2h[pick.value] || {}).map(([id, v]) => ({ id, w: v[0], l: v[1], t: v[2] })).sort((a, b) => (b.w + b.l + b.t) - (a.w + a.l + a.t) || b.w - a.w);
    out.innerHTML = rows.length ? `<div class="scroll"><table><thead><tr><th>Opponent</th><th>Record</th><th class="r">Games</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td class="${R.current.includes(r.id) ? "" : "gone"}"><b>${N(r.id)}</b></td><td>${r.w}–${r.l}${r.t ? "–" + r.t : ""}</td><td class="r">${r.w + r.l + r.t}</td><td>${r.w > r.l ? '<span class="chip up">Leads</span>' : r.w < r.l ? '<span class="chip down">Trails</span>' : '<span class="chip">Level</span>'}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">No games on record yet.</p>`;
  };
  pick.addEventListener("change", draw); draw();
}

function renderCommish() {
  const C = D.commish, el = document.getElementById("commish");
  const when = ms => new Date(ms).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  const owed = C.owed.length ? `<div class="owed">${C.owed.map(o => `<div class="card"><div class="head">Week ${o.week}: ${short(o.winner)} takes one player from ${short(o.loser)}</div>
      <ol>${o.targets.map(p => `<li>${esc(p.name)} <span>${esc(p.pos)} · ${esc(p.nfl)} · ${f1(p.ppg)} a game</span></li>`).join("")}</ol></div>`).join("")}</div>`
    : `<p class="note">All steals from week ${C.last_done} have been made.</p>`;
  const W = D.robber.waiver_rule;
  const waiverRule = `<div class="scroll"><table><thead><tr><th>#</th><th>Before week ${W.week} results</th><th>Set to</th><th>Sleeper now</th></tr></thead><tbody>${W.after.map((n, i) => `<tr><td class="rank">${i + 1}</td><td>${esc(W.before[i])}</td><td><b>${esc(n)}</b></td><td class="${W.now[i] === n ? "" : "gone"}">${esc(W.now[i] || "")}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">${W.matches ? '<span class="chip good">Sleeper matches</span>' : '<span class="chip warn">Sleeper differs</span> If waivers have not run since, set Sleeper to the middle column. Once waiver claims run they move teams again, so a difference after that is expected.'} ${W.source === "commissioner" ? "Week " + W.week + " order is from the league's own table." : "Worked out automatically when week " + W.week + "'s games ended."}</p>`;
  const waiver = C.waiver.length ? `<div class="scroll"><table><thead><tr><th>Loser</th><th class="r">Waiver</th><th>Winner</th><th class="r">Waiver</th><th></th></tr></thead><tbody>${C.waiver.map(w => `<tr><td>${esc(w.loser)}</td><td class="r">${w.loser_pos ?? ""}</td><td>${esc(w.winner)}</td><td class="r">${w.winner_pos ?? ""}</td><td>${w.ok ? '<span class="chip good">Loser ahead</span>' : '<span class="chip bad">Swap needed</span>'}</td></tr>`).join("")}</tbody></table></div>` : "";
  const lineups = C.lineups.length ? `<div class="scroll"><table><thead><tr><th>League</th><th>Manager</th><th>Problem</th></tr></thead><tbody>${C.lineups.map(x => `<tr><td>${esc(x.league)}</td><td><b>${esc(x.manager)}</b></td><td>${x.issues.map(i => `<div class="issue"><span class="chip ${i.level === "problem" ? "bad" : "warn"}">${i.level === "problem" ? "Fix" : "Watch"}</span>${esc(i.text)}</div>`).join("")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">Every starting lineup is full and playing.</p>`;
  const bench = C.bench.length ? `<div class="list"><ul class="plain">${C.bench.map(b => `<li><div><b>${esc(b.name)}</b> <span class="vs">${esc(b.pos)} · ${esc(b.nfl)}</span></div><div class="vs">${short(b.team)}</div></li>`).join("")}</ul></div>` : `<p class="note">Every benched Robber League player is injured or on a bye.</p>`;
  const moves = C.moves.length ? `<div class="scroll"><table><thead><tr><th>When</th><th>League</th><th>Type</th><th>Move</th></tr></thead><tbody>${C.moves.map(m => `<tr><td>${when(m.at)}</td><td>${esc(m.league)}</td><td>${esc(m.type === "commissioner" ? "admin" : m.type)}</td><td style="white-space:normal">${esc(m.text)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="note">No moves in the last two weeks.</p>`;
  el.innerHTML = `
    <p class="note">League admin tools. Updated with the rest of the site.</p>
    <div class="block"><h2>Robber League steals to make</h2>${owed}</div>
    <div class="block"><h2>Robber League waiver order</h2><p class="note">House rule: the week's losers move ahead of its winners, each group keeping its order.</p>${waiverRule}</div>
    <div class="block"><h2>Week ${C.week} lineup problems</h2><p class="note">Starters on a bye, ruled out or doubtful, and empty starting slots, across all three leagues.</p>${lineups}</div>
    <div class="block"><h2>Robber League bench check</h2>${bench}</div>
    ${G ? `<div class="block"><h2>Guillotine League</h2>
      <p class="note">Chops come from the scores (lowest season total); "Done" means that roster has been dropped in Sleeper. Penalties count as applied when a team's FAAB spent is at least its won bids plus the penalties.</p>
      <div class="scroll"><table><thead><tr><th>Week</th><th>Chop</th><th>Sleeper</th><th>$${G.penalty} penalty</th><th>FAAB check</th></tr></thead>
      <tbody>${[...G.weeks].reverse().map(w => { const pen = G.penalties.find(x => x.team === w.penalty); return `<tr><td>${w.week}</td><td><b>${esc(T[w.chopped].manager)}</b></td>
        <td>${w.sleeper === "done" ? chip("good", "Done") : chip("bad", "Drop roster")}${w.sleeper_chopped.length && !w.sleeper_chopped.includes(w.chopped) ? " " + chip("warn", "Sleeper dropped " + esc(w.sleeper_chopped.map(k => T[k].manager).join(", "))) : ""}</td>
        <td>${esc(T[w.penalty].manager)}</td><td>${pen && pen.over ? chip("warn", `Sleeper took $${pen.applied}`) : pen && pen.ok ? chip("good", "Applied") : chip("bad", "Not applied")}</td></tr>`; }).join("")}</tbody></table></div></div>` : ""}
    <div class="block"><h2>Recent moves</h2>${moves}</div>
    <div class="block"><h2>Recap archive</h2><p class="note">Save any week's recap, or the whole season, as a PDF for the league records. Choose "Save as PDF" in the print dialog.</p>
      <div class="pick"><label for="archive-week" class="sr-only">Recap to save</label>
        <select id="archive-week">${(D.recaps || []).map((R, i) => `<option value="${R.week}">Week ${R.week}${i === 0 ? " (latest)" : ""}</option>`).join("")}<option value="all">Whole season</option></select>
        <button type="button" class="pdf" id="archive-pdf">Save as PDF</button></div></div>`;
  document.getElementById("archive-pdf").addEventListener("click", () => {
    const v = document.getElementById("archive-week").value;
    printRecap(v === "all" ? "all" : +v);
  });
}

const LOCK_KEY = "apfn-commish";
let commishOpen = false;
try { commishOpen = sessionStorage.getItem(LOCK_KEY) === D.commish.lock.sha256; } catch (_) {}
async function pinMatches(pin) {
  const bytes = new TextEncoder().encode(`${D.commish.lock.salt}:${pin}`);
  const hash = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("") === D.commish.lock.sha256;
}
function askPin() {
  const dlg = document.getElementById("pin-dialog"), input = document.getElementById("pin-input"), err = document.getElementById("pin-error");
  input.value = ""; err.textContent = "";
  dlg.showModal(); input.focus();
}
document.getElementById("pin-form").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("pin-input"), err = document.getElementById("pin-error");
  if (await pinMatches(input.value.trim())) {
    commishOpen = true;
    try { sessionStorage.setItem(LOCK_KEY, D.commish.lock.sha256); } catch (_) {}
    document.getElementById("pin-dialog").close();
    document.getElementById("tab-commish").classList.remove("locked");
    renderCommish(); show("commish");
  } else {
    err.textContent = "That PIN isn't right."; input.select();
  }
});
document.getElementById("pin-cancel").addEventListener("click", () => document.getElementById("pin-dialog").close());

// ---- banner ------------------------------------------------------------------------------------
function roman(n) { return [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]].reduce((s, [v, r]) => { while (n >= v) { s += r; n -= v; } return s; }, ""); }
function renderHero() {
  const seasonNo = Number(D.season) - 2020, L = D.league, week = D.week_now;  // 2021 was Season 1
  const rank = Object.fromEntries(L.table.map(t => [t.key, t.rank]));
  const plate = (k, tag) => {
    const t = T[k], pic = t.avatar ? `<img class="av" src="${esc(t.avatar)}" alt="" referrerpolicy="no-referrer">` : "";
    return `<div class="np"><div class="frame"><div class="panel">${pic}<div class="who"><b style="--len:${Math.max(t.manager.length, 8)}">${esc(t.manager)}</b><span>${esc(tag)}</span></div></div></div></div>`;
  };
  // The league shield already reads "Season 6"; the gold ribbon is only for the playoffs and the champion.
  let ribbon = "", label = "", row = "";
  const titleRound = L.title.find(r => r.week === week);
  if (L.champion) {
    ribbon = "Champion"; label = `APFN Pro League<i>|</i>Season ${seasonNo} champion`;
    row = `<div class="row" style="grid-template-columns:minmax(0,380px)">${plate(L.champion, T[L.champion].team)}</div>`;
  } else {
    let a, b, tags;
    if (titleRound) {
      const g = titleRound.games[0];
      ribbon = "Playoffs"; label = `Week ${week}<i>|</i>${esc(g.label)}`; [a, b] = [g.hi, g.lo]; tags = [`#${g.hi_seed} seed`, `#${g.lo_seed} seed`];
    } else if (L.week_games.games.length) {
      const g = L.week_games.games[0];  // game of the week: first in the ranked list
      label = `Week ${week}<i>|</i>Game of the week`; [a, b] = [g.a, g.b]; tags = [`League #${rank[a]}`, `League #${rank[b]}`];
    }
    if (a) row = `<div class="row">${plate(a, tags[0])}<span class="vs" role="img" aria-label="versus">VS</span>${plate(b, tags[1])}</div>`;
  }
  document.getElementById("hero-ribbon").innerHTML = ribbon ? `<span class="ribbon-gold">${esc(ribbon)}</span>` : "";
  document.getElementById("hero-gotw").innerHTML = row ? `<div class="label">${label}</div>${row}` : "";
  document.getElementById("hero-status").innerHTML = `Season ${seasonNo}<i> / </i>${D.season}<i> / </i>through week ${last}<i> / </i>updated ${esc(D.built)}`;
}

function show(tab) {
  if (!["recap", "preview", "power", "conferences", "robber", "guillotine", "records", "commish"].includes(tab)) tab = "recap";
  if (tab === "commish" && !commishOpen) { askPin(); return; }
  document.querySelectorAll("section.panel").forEach(p => p.hidden = p.id !== tab);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  show(b.dataset.tab);
  try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (_) {}
});

renderHero();
document.getElementById("foot").textContent = "Scores and rosters come from Sleeper's public API. Rankings, luck and robbery figures are calculated here and are not official league standings.";
renderRecap(); renderPreview(); renderPower(); renderConferences(); renderRobber(); renderGuillotine(); renderRecords();
if (commishOpen) { renderCommish(); document.getElementById("tab-commish").classList.remove("locked"); }
show(location.hash.slice(1));
</script>
</body>
</html>
